var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			mafglib_version_range  : libs.versions.range.mafglib.get(),
			minecraft_version_range: libs.versions.range.game.get(),
			neoforge_version_range : libs.versions.range.neoforge.get(),
			fml_version_range      : libs.versions.range.fml.get(),
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_version            : "${project.version}",
			mod_link               : libs.versions.mod.link.get()
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

sourceSets.main.resources {
	srcDir generateModMetadata
}


tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.20.5/1.21 (24w14a) upwards uses Java 21.
	it.options.release = 25
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = true
	//reproducibleFileOrder = true
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}"}
	}
}

tasks.publish.dependsOn build
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			//artifact(jar)             { builtBy remapJar }
			artifactId = base.archivesName.get()
			from components.java
		}
	}

	repositories {
		maven {
			url = "$projectDir/../../CommonMaven"
		}

		maven {
			name = "KTTMaven"
			url = "https://maven.kessokuteatime.work/releases"

			credentials {
				username = System.getenv("KTT_MAVEN_USERNAME")
				password = System.getenv("KTT_MAVEN_TOKEN")
			}
		}
	}
}

publisher {
	apiKeys {
		modrinth System.getenv("MODRINTH_TOKEN")
		curseforge System.getenv("CURSEFORGE_TOKEN")
	}

	setCurseID("${libs.versions.platformId.curseforge.get()}")
	setModrinthID("${libs.versions.platformId.modrinth.get()}")
	setVersionType("${libs.versions.version.type.get()}")
	setChangelog(file("CHANGELOG.md").getText("UTF-8"))
	setVersion("${project.version}")
	setDisplayName("${project.version}")
	setGameVersions("26.1", "26.1.1", "26.1.2")
	setLoaders(loom.platform.get().id())
	setCurseEnvironment("${libs.versions.version.env.get()}")
	setArtifact(jar)
	addAdditionalFile(sourcesJar)
	curseDepends.required("mafglib")
	modrinthDepends.required("mafglib")
}

