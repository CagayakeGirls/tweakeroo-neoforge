plugins {
    id 'team.cagayakegirls.scripts'
    id 'dev.architectury.loom'
    id 'com.hypherionmc.modutils.modpublisher' version '2.1.6'
    id 'maven-publish'
}

repositories {
	maven {url = "https://masa.dy.fi/maven/sakura-ryoko"
		content {includeGroupAndSubgroups("fi.dy.masa")}
	}
	maven {url = 'https://maven.fallenbreath.me/releases'
		content {includeGroupAndSubgroups("me.fallenbreath")}
	}
	maven { url = 'https://maven.terraformersmc.com/releases/'
		content {includeGroupAndSubgroups("com.terraformersmc")}
	}
	maven { url = 'https://jitpack.io' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings extraMappings.yarnWithPatch(project.mappings_version, "1.21+build.4")
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
	implementation "com.google.code.findbugs:jsr305:3.0.2"

    modImplementation "team.cagayakegirls.mafglib:mafglib:${project.malilib_version}"
//	modRuntimeOnly 'me.fallenbreath:mixin-auditor:0.1.0'
}

base {
	group = project.group + "." + project.mod_id
	archivesName = project.mod_file_name
	version = "${project.mod_version}+mc${project.minecraft_version_out}"

	if (version.endsWith('-dev')) {
		version += "." + new Date().format('yyyyMMdd.HHmmss')
	}
}

loom {
	accessWidenerPath = file("src/main/resources/tweakeroo.accesswidener")

//	def commonVmArgs = ['-Dmixin.debug.export=true', '-Dmixin.debug.countInjections=true']
//	// [FEATURE] MIXIN_AUDITOR
//	runs {
//		def auditVmArgs = [*commonVmArgs, '-DmixinAuditor.audit=true']
//		clientMixinAudit {
//			client()
//			vmArgs auditVmArgs
//			ideConfigGenerated false
//		}
//	}
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range : neoforge_version_range,
            malilib_version_range  : malilib_version_range,
            fml_version_range      : fml_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : "${project.version}",
            mod_link               : mod_link
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources {
    srcDir generateModMetadata
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.20.5/1.21 (24w14a) upwards uses Java 21.
	it.options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = true
	//reproducibleFileOrder = true
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName}"}
	}
}

tasks.publish.dependsOn build
publishing {
    publications {
        mavenJava(MavenPublication) {
            // How to introduce archivesName here without it breaking?
            artifactId = base.archivesName.get()

            // add all the jars that should be included when publishing to maven
            //artifact(jar)             { builtBy remapJar }
            from components.java
        }
    }

    repositories {
        maven {
            url = "$projectDir/../../CommonMaven"
        }

        maven {
            name = "KTTMaven"
            url = "https://maven.kessokuteatime.work/releases"

            credentials {
                username = System.getenv("KTT_MAVEN_USERNAME")
                password = System.getenv("KTT_MAVEN_TOKEN")
            }
        }
    }
}

publisher {
    apiKeys {
        modrinth System.getenv("MODRINTH_TOKEN")
        curseforge System.getenv("CURSEFORGE_TOKEN")
    }

    setCurseID("${project.curseforge_id}")
    setModrinthID("${project.modrinth_id}")
    setVersionType("${project.version_type}")
    setChangelog(file("CHANGELOG.md").getText("UTF-8"))
    setVersion("${project.version}")
    setDisplayName("${project.version}")
    setGameVersions("1.21.1")
    setLoaders(loom.platform.get().id())
    setCurseEnvironment("client")
    setArtifact(remapJar)
    addAdditionalFile(sourcesJar)
    curseDepends.required("mafglib")
    modrinthDepends.required("mafglib")
}
